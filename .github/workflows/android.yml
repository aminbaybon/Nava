name: Android verification
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew :domain:test :verification:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - run: python3 scripts/check_resources.py
      - uses: actions/upload-artifact@v4
        with:
          name: nava-debug-and-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            domain/build/reports/
