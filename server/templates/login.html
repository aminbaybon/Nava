{% extends "base.html" %}
{% block body %}
<section class="card">
  <h1>Sign in</h1>
  <p class="muted">Coordinators and administrators use this portal. Patients use the Android app. Demonstration passwords belong only on a local machine.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Email <input name="email" type="email" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
